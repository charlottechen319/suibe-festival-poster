<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>节日海报</title>
<link rel="stylesheet" href="poster.css">
</head>
<body>
<div class="poster" id="poster">
  <div class="paper"></div>
  <svg class="scene" id="scene" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

  <div class="veil"></div>
  <div class="bottom-wash"></div>

  <div class="eyebrow" id="eyebrow"></div>

  <div class="date" id="date">
    <span class="g"></span>
    <span class="rule"></span>
    <span class="l"></span>
  </div>

  <div class="calligraphy" id="calligraphy"></div>
  <div class="seal" id="seal"><span class="s"></span><span class="s"></span></div>

  <div class="couplet" id="couplet"></div>

  <div class="logo" id="logo">
    <img src="../assets/logo-mark-official.png" alt="上海对外经贸大学研究生会标识">
    <span class="name">上海对外经贸大学研究生会</span>
  </div>

  <div class="grain" id="grain"></div>
  <div class="vignette"></div>
</div>

<script id="poster-config" type="application/json">__CONFIG__</script>
<script src="scene.js"></script>
</body>
</html>
